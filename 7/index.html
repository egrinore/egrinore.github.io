<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1030">
<meta name="robots" content="noindex, nofollow">
<title>Тропы Дальнего Востока</title>
<meta property="og:title" content="Тропы Дальнего Востока">
<meta property="og:type" content="website">
<meta property="og:url" content="https://egrinore.github.io/7/">
<meta property="og:image" content="https://egrinore.github.io/7/preview.webp">
<link rel="stylesheet" href="../trails.css?v=5da584ed">
</head>
<body>
<main class="page">
	<img class="title" src="../trails-title.webp" width="1200" height="453" alt="Пройди тропами Дальнего Востока">

	<figure class="card">
		<img src="preview.webp" width="1080" height="1500" alt="Буклет «Тропы Дальнего Востока»">
	</figure>

	<div class="actions">
		<a class="btn btn-primary" href="trails-1.pdf" download="trails-1.pdf">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 21h16"/></svg>
			Скачать PDF
		</a>
		<a class="btn btn-secondary" href="trails-1.pdf" target="_blank" rel="noopener">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6m0-6L10 14M18 14v6H4V6h6"/></svg>
			Открыть
		</a>
		<button class="btn btn-secondary" id="share" type="button" hidden>
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3m0 0L7 8m5-5 5 5M5 12v8h14v-8"/></svg>
			Поделиться
		</button>
	</div>
</main>

<script>
(function () {
	var file = 'trails-1.pdf', type = 'application/pdf';
	var share = document.getElementById('share');
	if (navigator.canShare && window.File) {
		try {
			if (navigator.canShare({ files: [new File([''], file, { type: type })] })) share.hidden = false;
		} catch (e) {}
	}
	share.addEventListener('click', function () {
		fetch(file).then(function (r) { return r.blob(); }).then(function (blob) {
			return navigator.share({ files: [new File([blob], file, { type: type })] });
		}).catch(function () {});
	});
})();
</script>
</body>
</html>
